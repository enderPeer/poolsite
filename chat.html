<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoolSite — Chat</title>
<meta name="description" content="PoolSite Chat — schreibe mit deinen Freunden.">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="index.html"><span class="logo-mark">P</span> PoolSite</a>
    <a class="back" href="friends.html">← Zurück zu Freunden</a>
  </div>
</header>
<div class="beta-banner" id="mode-banner">Verbinde…</div>
<nav id="app-nav" class="appnav" style="display:none"></nav>

<main>
  <div class="wrap">
    <div class="chat-wrap">
      <div class="chat-head">
        <div class="avatar-sm" id="ch-avatar"><span>?</span></div>
        <div class="name" id="ch-name">—</div>
      </div>
      <div class="chat-box" id="chat-box">
        <div class="chat-empty">Lade Chat…</div>
      </div>
      <div class="transfer-form" id="transfer-form" style="display:none">
        <input type="number" id="transfer-amount" min="0.01" step="0.01" placeholder="Betrag (PST)">
        <button class="pill-btn primary" onclick="doTransfer()">Senden</button>
        <button class="pill-btn" onclick="toggleTransfer(false)">Abbrechen</button>
        <span class="hint-inline" id="transfer-balance"></span>
      </div>
      <div class="chat-input">
        <button class="pill-btn" title="GIF senden" onclick="document.getElementById('gif-file').click()">GIF</button>
        <button class="pill-btn" title="Token senden" id="btn-transfer" onclick="toggleTransfer(true)">PST</button>
        <input type="text" id="msg-text" maxlength="1000" placeholder="Nachricht schreiben…"
          onkeydown="if(event.key==='Enter')send()">
        <button class="btn small" onclick="send()">Senden</button>
      </div>
      <input type="file" id="gif-file" accept="image/gif" style="display:none" onchange="pickGif(this)">
      <div class="msg" id="msg-err"></div>
    </div>
  </div>
</main>

<script src="assets/i18n.js"></script>
<script src="assets/app-core.js"></script>
<script>
var friendKey = new URLSearchParams(location.search).get('u');
var lastCount = -1;

function setErr(text) {
  var el = document.getElementById('msg-err');
  el.className = 'msg' + (text ? ' error' : '');
  el.textContent = text || '';
}

function render(d) {
  document.getElementById('ch-avatar').innerHTML = PS.avatarHtml(d.friend);
  document.getElementById('ch-name').textContent = d.friend.name;
  document.title = 'PoolSite — Chat mit ' + d.friend.name;

  var box = document.getElementById('chat-box');
  if (!d.messages.length) {
    box.innerHTML = '<div class="chat-empty">Noch keine Nachrichten — schreib die erste! 👋</div>';
    lastCount = 0;
    return;
  }
  if (d.messages.length === lastCount) return; // nichts Neues -> kein Scroll-Reset
  lastCount = d.messages.length;
  var meKey = PS.me().key;
  box.innerHTML = d.messages.map(function (m) {
    var mine = m.from === meKey;
    var time = new Date(m.at).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    var cls = 'bubble ' + (mine ? 'mine' : 'theirs');
    if (m.type === 'transfer') {
      var label = mine ? ('Du hast ' + m.amount + ' PST gesendet') : ('+' + m.amount + ' PST erhalten');
      return '<div class="' + cls + ' transfer">' + label + '<span class="t">' + time + '</span></div>';
    }
    if (m.type === 'gif') {
      return '<div class="' + cls + ' gifmsg"><img class="chat-gif" src="' + PS.media(m.gif) + '" alt="GIF" loading="lazy">' +
        '<span class="t">' + time + '</span></div>';
    }
    return '<div class="' + cls + '">' + PS.escapeHtml(m.text) + '<span class="t">' + time + '</span></div>';
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function refresh() {
  return PS.chat(friendKey).then(function (d) { setErr(''); render(d); })
    .catch(function (e) { setErr(e.message); });
}

function send() {
  var inp = document.getElementById('msg-text');
  var text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  PS.sendMessage(friendKey, text).then(refresh).catch(function (e) { setErr(e.message); });
}

/* GIF senden (animiert, ohne Re-Encoding; Limit ~1,5 MB) */
function pickGif(input) {
  var file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  if (file.type !== 'image/gif') { setErr('Bitte wähle eine GIF-Datei aus.'); return; }
  if (file.size > 1.5 * 1024 * 1024) { setErr('GIF zu groß (max. 1,5 MB).'); return; }
  var r = new FileReader();
  r.onload = function (e) {
    PS.sendGif(friendKey, e.target.result).then(refresh).catch(function (err) { setErr(err.message); });
  };
  r.readAsDataURL(file);
}

/* Token an den Chat-Partner senden */
function toggleTransfer(show) {
  document.getElementById('transfer-form').style.display = show ? '' : 'none';
  if (show) {
    var me = PS.me();
    document.getElementById('transfer-balance').textContent = 'Verfügbar: ' + (me.tokens || 0) + ' PST';
    document.getElementById('transfer-amount').focus();
  }
}

function doTransfer() {
  var amt = +document.getElementById('transfer-amount').value || 0;
  PS.transferTokens(friendKey, amt).then(function () {
    document.getElementById('transfer-amount').value = '';
    toggleTransfer(false);
    setErr('');
    return refresh();
  }).catch(function (e) { setErr(e.message); });
}

document.addEventListener('DOMContentLoaded', function () {
  PS.init().then(function () {
    if (!PS.me()) { location.href = 'app.html'; return; }
    if (!friendKey) { location.href = 'friends.html'; return; }
    PS.modeBanner();
    PS.renderNav('friends');
    refresh().then(function () { document.getElementById('msg-text').focus(); });
    if (PS.getMode() === 'server') setInterval(refresh, 3000);
  });
});
</script>

</body>
</html>
